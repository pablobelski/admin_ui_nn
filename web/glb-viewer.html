<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLB Viewer</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f5f5f3;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: #f5f5f3;
    }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <model-viewer
    id="viewer"
    camera-controls
    auto-rotate
    interaction-prompt="none"
    shadow-intensity="0"
    exposure="1"
    tone-mapping="neutral">
  </model-viewer>
  <script>
    const viewer = document.getElementById('viewer');
    const directModelUrl = new URLSearchParams(window.location.search).get('model');
    if (directModelUrl) viewer.setAttribute('src', directModelUrl);

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) return;
      if (typeof event.data !== 'string' || !event.data.startsWith('blob:')) return;
      viewer.setAttribute('src', event.data);
    });
  </script>
</body>
</html>
